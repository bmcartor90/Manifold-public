<!DOCTYPE html>
<!-- The web tutorial's page (Unity's Web build template "Manifold", chosen by Assets/Editor/Builds.cs): the game fills
     the window, so it fits whatever frame shows it (the iframe on MountBakerGames.com), with Manifold's own loading
     screen until the game's menu is drawn (Brad, 2026-10-31: nothing of Unity's shows). Its bar fills as Unity loads,
     then as the game fetches its files, which the game says through Assets/Plugins/WebGL/Manifold.jslib. Unity fills
     in the names in triple braces and the #if blocks when it builds; nothing else here may use triple braces, even in
     a comment (Unity reads every one as code). -->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>ManifoldUnity: learn to play</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #16120d; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #16120d; outline: none; }
      #loading {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: radial-gradient(ellipse at center, #2a2118 0%, #16120d 70%);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #c9b98f;
      }
      #loading img { width: min(60vw, 560px); height: auto; }
      #bar { width: min(50vw, 420px); height: 10px; border: 1px solid #8a7140; border-radius: 6px; background: #0e0b08; overflow: hidden; }
      #fill { width: 0; height: 100%; background: linear-gradient(90deg, #a8822e, #e2bd5a); transition: width 0.2s; }
      #message { font-size: 15px; letter-spacing: 0.04em; text-align: center; max-width: 80vw; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img src="logo.png" alt="Manifold">
      <div id="bar"><div id="fill"></div></div>
      <div id="message">Loading...</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var message = document.querySelector("#message");
      var config = {
        arguments: [],
        dataUrl: "Build/4148237089688c804ae71d964a892ffb.data.unityweb",
        frameworkUrl: "Build/e25c85ccb3f0ad30e2a00a8da531f596.framework.js.unityweb",
        codeUrl: "Build/f4dd6f6400be090a8717c714f23f5cbc.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ManifoldUnity",
        productVersion: "1.0",
        // Problems go on the loading screen, never in a pop-up (it's inside someone's web page)
        showBanner: function (text, type) {
          if (type === "error") {
            message.textContent = text;
          }
        },
      };
      // The bar: Unity's own loading the first 60%, the game fetching its files the rest. The game says how far it is,
      // and when its menu is drawn the loading screen goes (Manifold.jslib calls these).
      var unityShare = 0.6;
      var gone = false;
      function show(share) {
        fill.style.width = (100 * Math.max(0, Math.min(1, share))) + "%";
      }
      function done() {
        if (!gone) {
          gone = true;
          loading.remove();
          canvas.focus(); // keys go to the game
        }
      }
      window.manifoldLoading = function (progress) {
        message.textContent = "Loading the cards...";
        show(unityShare + (1 - unityShare) * progress);
      };
      window.manifoldLoaded = done;
      window.manifoldProblem = function (text) {
        message.textContent = text + " Try reloading the page.";
      };
      // Opened from a folder (file://), a browser won't let the game load its own files: say so, rather than "Script error."
      var fromFolder = location.protocol === "file:";
      var script = document.createElement("script");
      script.src = "Build/6a5df06baa1e1851d85cfac748f36ab7.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          show(unityShare * progress);
        }).then(function () {
          // Unity is up; the game fetches its files and says when its menu is drawn. If it never says (a build from
          // before it did), the loading screen goes after a while anyway.
          show(unityShare);
          setTimeout(done, 120000);
        }).catch(function (problem) {
          message.textContent = fromFolder
            ? "This page has to be opened from its web address (a web server), not from a folder on your computer."
            : "Couldn't load the game: " + problem;
        });
      };
      script.onerror = function () {
        message.textContent = "Couldn't load the game. Try reloading the page.";
      };
      document.body.appendChild(script);
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
